[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffoptics"
version = "0.1.0"
description = "Differentiable Ray Tracing & Aspheric Lens Surface Optimization via Automatic Differentiation"
readme = "README.md"
authors = [{ name = "ZengLLQ" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
diffoptics = "diffoptics.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
